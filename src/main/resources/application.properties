spring.application.name=java-afetto

# Porta da API. Localmente fica na 8081 (a 8080 está ocupada na máquina do time).
# Se a variável PORT existir, vale ela: o Dockerfile define PORT=8080 (o container
# continua na 8080) e servidores como o Render informam a porta deles por ela.

spring.datasource.url=jdbc:h2:mem:afetto
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Coordenadas do CEP do tutor (para o "perto de você" das clínicas).
# Deixe vazio para desligar: aí "perto" passa a ser estar na mesma cidade.
afetto.geolocalizacao.url=https://cep.awesomeapi.com.br/json/{cep}
