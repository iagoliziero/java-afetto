spring.application.name=java-afetto

spring.datasource.url=jdbc:h2:mem:afetto
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Coordenadas do CEP do tutor (para o "perto de você" das clínicas).
# Deixe vazio para desligar: aí "perto" passa a ser estar na mesma cidade.
afetto.geolocalizacao.url=https://cep.awesomeapi.com.br/json/{cep}
