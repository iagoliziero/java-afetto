spring.application.name=java-afetto

# Porta: local continua 8080; no Render vale a PORT que ele define.
server.port=${PORT:8080}

# Sessão de login (cookie JSESSIONID) dura 7 dias, sem uso ou não. O max-age
# faz o celular guardar o cookie: fechar e abrir o app não pede login de novo.
# A sessão fica na memória da API: reiniciar a API (ex.: Render "dormindo"
# na instância gratuita) apaga as sessões, junto com o H2.
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=7d

# No Render, o HTTPS termina no proxy dele e a API recebe http. Lendo os
# cabeçalhos X-Forwarded-*, os links HATEOAS saem com https e o endereço público.
server.forward-headers-strategy=framework

# Conta ADMIN criada quando a API sobe (security/ContaAdminInicial). Defina as
# variáveis ADMIN_EMAIL e ADMIN_SENHA (mín. 8 caracteres) no Render
# (Environment) ou no IntelliJ — nunca escreva a senha aqui. Sem elas, não há ADMIN.
afetto.admin.email=${ADMIN_EMAIL:}
afetto.admin.senha=${ADMIN_SENHA:}

spring.datasource.url=jdbc:h2:mem:afetto
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Coordenadas do CEP do tutor (para o "perto de você" das clínicas).
# Deixe vazio para desligar: aí "perto" passa a ser estar na mesma cidade.
afetto.geolocalizacao.url=https://cep.awesomeapi.com.br/json/{cep}
